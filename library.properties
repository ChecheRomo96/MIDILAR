sentence=Portable C++ MIDI protocol, parsing and real-time device processing built on Foundation, DspCore and MCC.
paragraph=MIDI layer for embedded and desktop projects with UMP processing, native short MIDI 1.0 messages, caller-buffer SysEx, and explicit conversions. Never throws exceptions. Arduino source builds support stock C++11 cores; CMake and direct source builds use C++17.
category=Other
